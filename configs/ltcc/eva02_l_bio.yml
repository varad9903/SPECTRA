MODEL:
  TYPE: eva02_cloth
  NAME: eva02_l_bio
  LOSS_TYPE:
    - 'ce'
    - 'triplet'
    - 'clipBio'
    - 'clipBioReverse'
  LAST_LAYER: 'clipFc'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NO_MARGIN: True
  CLIP_DIM: 768
  CLIP_LOSS_TYPE: 'constant'
  MEMORY_BANK_SIZE: 0
  GRL_LOSS_WEIGHT: 1.0
  ORTHO_WEIGHT: 0.0
  USE_PROJECTION_MLP: true
  USE_REFINER: True
  REFINER_HEADS: 8
  REFINER_DROPOUT: 0.1
DATA:
  CAPTION_DIR: 'TextCaptionDirectory/LTCC_Qwen'
  IMG_HEIGHT: 224
  IMG_WIDTH: 224
  DATASET: 'ltcc'
  NOBIO_INDEX:
    - '1'
  SUMMERY_TEXT: true
  TEXT_MODEL_VERSION: 'nomic-embed-v1.5'
  TEXT_MODEL: 'nomic-embed'
  NUM_INSTANCES: 2
  BATCH_SIZE: 8
  NUM_WORKERS: 1
  PIN_MEMORY: False
SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 60
  BASE_LR: 2e-6
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 60
  LOG_PERIOD: 50
  EVAL_PERIOD: 1
  WEIGHT_DECAY: 0.05
  WEIGHT_DECAY_BIAS: 0.05
  BIAS_LR_FACTOR: 2
TEST:
  WEIGHT: ''
  FEAT_NORM: 'yes'
  TYPE: 'image_only'
  NFC_MODE: 'none'
OUTPUT_DIR: './logs/ltcc'